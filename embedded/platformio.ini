; PlatformIO project: portability / real-time benchmark of the gait phase estimator
; (causal bandpass + adaptive oscillator + event detector + Yan phase correction,
; coupled AO, and exact windowed TCN inference) on microcontrollers.
;
; Environments (all share the portable C sources in lib/gaitphase and src/main.cpp):
;   f32          ESP32 (esp32dev), single precision  -- deployment configuration
;   f64          ESP32, double precision             -- validation build (software double)
;   teensy41     Teensy 4.1 (i.MX RT1062, Cortex-M7 600 MHz, FPU with FMA), single precision
;   teensy41_f64 Teensy 4.1, double precision (hardware double on the M7)
;
; Build/flash from this folder with the PlatformIO CLI, e.g.
;   pio run -e f32 -t upload
;   pio run -e teensy41 -t upload
; The CLI lives in %USERPROFILE%\.platformio\penv\Scripts\pio.exe when installed by the
; VS Code extension. Serial ports: the ESP32 devkit enumerates as a CP210x serial port
; (pass it with --upload-port / --monitor-port); the Teensy as a USB CDC port, found automatically.

[platformio]
default_envs = f32

[common]
build_flags =
    -O2
    -Wall
    -Wextra
    -DGP_SERIAL_BAUD=921600

; ------------------------------------------------------------------ ESP32 ----
[esp32]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
; the TCN weights (230 kB) live in memory-mapped flash; run it at 80 MHz QIO rather
; than the 40 MHz DIO default so cache-line fills cost less (the module supports it)
board_build.f_flash = 80000000L
board_build.flash_mode = qio
upload_speed = 921600
monitor_speed = 921600
monitor_filters = direct
lib_ldf_mode = deep
build_unflags = -Os
build_flags = ${common.build_flags} -DCORE_DEBUG_LEVEL=0

[env:f32]
extends = esp32

[env:f64]
extends = esp32
build_flags = ${esp32.build_flags} -DGP_USE_DOUBLE

; ------------------------------------------------------------- Teensy 4.1 ----
[teensy]
platform = teensy@5.2.0
board = teensy41
framework = arduino
monitor_speed = 921600
monitor_filters = direct
lib_ldf_mode = deep
build_flags = ${common.build_flags}

[env:teensy41]
extends = teensy

[env:teensy41_f64]
extends = teensy
build_flags = ${teensy.build_flags} -DGP_USE_DOUBLE
